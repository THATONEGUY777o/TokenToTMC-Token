<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token to TMC token</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      color: #ffffff;
      /* Set the starry hill image as the background */
      background: url('image.png') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* Fullscreen canvas for the digital rain effect */
    #rainCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0; /* Placed in front of background, behind UI */
      pointer-events: none; /* Allows clicks to pass through to the form */
    }

    /* Container for form elements to stay above the rain */
    .container {
      position: relative;
      z-index: 1;
      background: rgba(13, 13, 13, 0.65); /* Semi-transparent dark backdrop for readability */
      padding: 25px;
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
      backdrop-filter: blur(4px);
    }

    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #00ffff;
      text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      font-family: monospace;
      background-color: rgba(26, 26, 26, 0.85);
      color: #00ffff;
      border: 1px solid #00ffff;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ffff;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
      outline: none;
    }
    input[type="text"]:focus, textarea:focus {
      box-shadow: 0 0 15px #00ffff;
    }
    textarea {
      resize: vertical;
    }
    .input-box {
      height: 80px;
    }
    .output-box {
      height: 180px;
      background-color: rgba(18, 18, 18, 0.85);
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    button, .file-label {
      padding: 10px 15px;
      border: 1px solid #00ffff;
      border-radius: 4px;
      cursor: pointer;
      color: #00ffff;
      font-weight: bold;
      font-size: 13.33px;
      display: inline-block;
      background-color: rgba(22, 22, 22, 0.85);
      text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
      transition: all 0.2s ease-in-out;
    }
    button:hover, .file-label:hover {
      background-color: #00ffff;
      color: #0d0d0d;
      text-shadow: none;
      box-shadow: 0 0 15px #00ffff, 0 0 25px #00ffff;
    }

    h2 {
      color: #ffffff;
      text-align: center;
      margin-top: 0;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    /* Hide the default HTML file input */
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Rain Layer -->
  <canvas id="rainCanvas"></canvas>

  <!-- Foreground Content -->
  <div class="container">
    <h2>Token to TMC Token</h2>

    <div class="form-group">
      <label for="accessToken">Bearer / Access Token:</label>
      <textarea id="accessToken" class="input-box" placeholder="Paste access token here..."></textarea>
    </div>

    <div class="form-group">
      <label for="refreshToken">Refresh Token:</label>
      <textarea id="refreshToken" class="input-box" placeholder="Paste refresh token here..."></textarea>
    </div>

    <div class="form-group">
      <label for="username">Username:</label>
      <input type="text" id="username" placeholder="Enter username...">
    </div>

    <div class="button-group">
      <button class="btn-generate" onclick="generateTokenJSON()">Generate TMC Token</button>
    </div>

    <div class="form-group">
      <label for="outputBox">Output:</label>
      <textarea id="outputBox" class="output-box" placeholder="Click 'Generate JSON' or upload a token file..."></textarea>
    </div>

    <div class="button-group">
      <!-- Styled File Upload Button -->
      <label for="fileInput" class="file-label btn-upload">Upload token.json</label>
      <input type="file" id="fileInput" accept=".json" onchange="uploadTokenJSON(event)">

      <button class="btn-download" onclick="downloadTokenJSON()">Download token.json</button>
      <button class="btn-copy" onclick="copyToClipboard()">Copy Output</button>
      <button class="btn-clear" onclick="clearAll()">Clear All</button>
    </div>
  </div>

  <script>
    /* Rain Canvas Animation */
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const raindrops = [];
    const raindropCount = 120;

    for (let i = 0; i < raindropCount; i++) {
      raindrops.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        length: Math.random() * 20 + 10,
        speed: Math.random() * 8 + 4,
        opacity: Math.random() * 0.5 + 0.2
      });
    }

    function animateRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < raindrops.length; i++) {
        const drop = raindrops[i];
        
        ctx.beginPath();
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x - 2, drop.y + drop.length);
        ctx.strokeStyle = `rgba(0, 255, 255, ${drop.opacity})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        drop.y += drop.speed;
        drop.x -= 0.5; // Slightly slanted rain trajectory

        // Reset drop position when it hits bottom
        if (drop.y > canvas.height) {
          drop.y = -drop.length;
          drop.x = Math.random() * canvas.width;
        }
      }

      requestAnimationFrame(animateRain);
    }
    animateRain();

    /* Token Application Logic */
    function generateTokenJSON() {
      const accessToken = document.getElementById('accessToken').value.trim();
      const refreshToken = document.getElementById('refreshToken').value.trim();
      const username = document.getElementById('username').value.trim();

      if (!accessToken || !refreshToken || !username) {
        alert('Please fill in all fields.');
        return;
      }

      const tokenData = {
        bearer: accessToken,
        refresh_token: refreshToken,
        username: username
      };

      document.getElementById('outputBox').value = JSON.stringify(tokenData, null, 2);
    }

    function uploadTokenJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          document.getElementById('outputBox').value = JSON.stringify(parsed, null, 2);

          if (parsed.bearer) document.getElementById('accessToken').value = parsed.bearer;
          if (parsed.refresh_token) document.getElementById('refreshToken').value = parsed.refresh_token;
          if (parsed.username) document.getElementById('username').value = parsed.username;
        } catch (err) {
          alert('Invalid JSON file.');
        }
      };
      reader.readAsText(file);

      event.target.value = '';
    }

    function downloadTokenJSON() {
      const outputText = document.getElementById('outputBox').value;

      if (!outputText) {
        alert('Please generate or upload JSON first.');
        return;
      }

      const blob = new Blob([outputText], { type: 'application/json' });
      const downloadUrl = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = downloadUrl;
      link.download = 'token.json';
      
      document.body.appendChild(link);
      link.click();
      
      document.body.removeChild(link);
      URL.revokeObjectURL(downloadUrl);
    }

    function copyToClipboard() {
      const outputBox = document.getElementById('outputBox');

      if (!outputBox.value) {
        alert('Nothing to copy!');
        return;
      }

      navigator.clipboard.writeText(outputBox.value).then(() => {
        alert('Copied to clipboard!');
      }).catch(err => {
        alert('Failed to copy: ' + err);
      });
    }

    function clearAll() {
      document.getElementById('accessToken').value = '';
      document.getElementById('refreshToken').value = '';
      document.getElementById('username').value = '';
      document.getElementById('outputBox').value = '';
    }
  </script>

</body>
</html>
